[project]
name = "knowflow-agent"
version = "0.4.0"
description = "KnowFlow agent glue (Kimi LLM adapter + KnowFlow tool runtime) built on the TitanX SDK"
requires-python = ">=3.11"
# The SDK is no longer vendored: this package depends on the TitanX source that
# lives at the monorepo root, three levels up from titanx-agent/.
dependencies = [
    "titanx @ file:../../..",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowflow_agent*"]
